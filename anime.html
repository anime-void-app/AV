<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ANIME VOID — Аниме</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #07060c;
      color: white;
      font-family: Inter, Arial, sans-serif;
    }

    .page-bg {
      position: fixed;
      inset: 0;
      z-index: -2;

      background-size: cover;
      background-position: center;

      filter: brightness(.35);
    }

    .page-overlay {
      position: fixed;
      inset: 0;
      z-index: -1;

      background:
        linear-gradient(
          to bottom,
          rgba(7,6,12,.20),
          #07060c 80%
        );
    }

    header {
      height: 72px;
      padding: 0 7%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: rgba(8,7,13,.82);
      backdrop-filter: blur(15px);

      border-bottom: 1px solid rgba(168,85,247,.15);
    }

    .logo {
      color: white;
      text-decoration: none;
      font-size: 24px;
      font-weight: 900;
    }

    .logo span {
      color: #a855f7;
    }

    .back {
      color: #d8b4fe;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 70px 6%;
    }

    .anime-page {
    align-items: start;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 45px;

      padding: 32px;

      background:
        radial-gradient(
          circle at top right,
          rgba(168,85,247,.15),
          transparent 35%
        ),
        rgba(12,10,18,.90);

      border: 1px solid rgba(168,85,247,.28);
      border-radius: 28px;

      box-shadow:
        0 30px 80px rgba(0,0,0,.55),
        0 0 40px rgba(147,51,234,.10);
    }

    .poster {
    aspect-ratio: 2 / 3;
      width: 100%;
      border-radius: 20px;
      overflow: hidden;

      border: 1px solid rgba(168,85,247,.45);

      box-shadow:
        0 20px 50px rgba(0,0,0,.5),
        0 0 25px rgba(168,85,247,.18);
    }

    .poster img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

    .tag {
      display: inline-block;

      padding: 7px 13px;
      border-radius: 999px;

      background: rgba(168,85,247,.12);
      border: 1px solid rgba(168,85,247,.35);

      color: #d8b4fe;

      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.4px;
    }

    h1 {
      margin: 18px 0 15px;

      font-size: clamp(32px, 5vw, 54px);
      line-height: 1.05;

      background:
        linear-gradient(90deg,#fff,#d8b4fe,#a855f7);

      background-clip: text;
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
    }

    .description {
      color: #c8c1d3;
      line-height: 1.8;
      font-size: 15px;

      max-width: 720px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 12px;

      margin-top: 28px;
    }

    .info {
      padding: 16px;

      border-radius: 15px;

      background:
        rgba(168,85,247,.08);

      border:
        1px solid rgba(168,85,247,.18);
    }

    .info small {
      display: block;

      margin-bottom: 6px;

      color: #8f879d;

      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }

    .info strong {
      font-size: 16px;
    }
    .favorite-page-btn {
  margin-top: 22px;
  padding: 13px 20px;

  border-radius: 12px;
  border: 1px solid rgba(168, 85, 247, .45);

  background: rgba(168, 85, 247, .12);
  color: white;

  font-size: 15px;
  font-weight: 800;
  cursor: pointer;

  transition:
    transform .2s ease,
    background .2s ease,
    box-shadow .2s ease;
}

.favorite-page-btn:hover {
  transform: translateY(-2px);
  background: rgba(168, 85, 247, .25);
  box-shadow: 0 8px 25px rgba(168, 85, 247, .20);
}

.favorite-page-btn.saved {
  background: linear-gradient(110deg, #7c3aed, #c026d3);
  border-color: #c084fc;
}

    .episodes {
      margin-top: 50px;
    }

    .episodes h2 {
      font-size: 25px;
    }

    .episode-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fill,minmax(120px,1fr));

      gap: 10px;

      margin-top: 18px;
    }

    .episode {
  padding: 14px;

  border: 1px solid rgba(168,85,247,.22);
  border-radius: 12px;

  background: #15111f;
  color: white;

  font-weight: 700;
  cursor: pointer;

  transition: .2s ease;
}

.episode.watched {
  border-color: #8b5cf6;
  background: rgba(139, 92, 246, 0.16);
  color: #d8b4fe;
}

.episode.watched:hover {
  background: rgba(139, 92, 246, 0.28);
}

    .episode:hover {
      transform: translateY(-2px);

      background:
        linear-gradient(110deg,#7c3aed,#a855f7);

      border-color: #c084fc;
    }

    .error {
      padding: 40px;
      text-align: center;
      color: #d8b4fe;
    }

    @media (max-width: 800px) {
      main { padding: 32px 4% 55px; }
      .anime-page {
        grid-template-columns: minmax(0, 1fr);
        gap: 26px;
        padding: 24px;
      }
      .poster {
        aspect-ratio: 2 / 3;
        width: min(100%, 280px);
        margin: 0 auto;
      }
      .info-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .season-switcher { gap: 7px; }
      .season-choice { min-height: 40px; }
    }

    @media (max-width: 520px) {
      header { padding: 12px 4%; gap: 8px; }
      .logo { font-size: 20px; }
      .back { font-size: 12px; }
      .lang-btn { margin-left: 4px; padding: 8px 10px; }
      main { padding: 20px 4% 42px; }
      .anime-page { padding: 16px; border-radius: 20px; gap: 20px; }
      .anime-page h1 { font-size: clamp(28px, 8vw, 42px); line-height: 1.08; overflow-wrap: anywhere; }
      .description { font-size: 14px; line-height: 1.7; }
      .info-grid { gap: 9px; }
      .info { padding: 12px; min-width: 0; }
      .info strong { font-size: 14px; overflow-wrap: anywhere; }
      .season-switcher { display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .season-choice { width:100%; padding:9px 7px; font-size:12px; }
      .episode-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .favorite-page-btn { width:100%; }
    }
    .episodes-progress-text {
  margin: -8px 0 18px;
  color: #a78bfa;
  font-size: 14px;
  font-weight: 600;
}
.episodes-progress-bar {
  width: 100%;
  height: 6px;
  margin-bottom: 20px;

  background: rgba(255, 255, 255, 0.12);
  border-radius: 10px;

  overflow: hidden;
}

.episodes-progress-fill {
  height: 100%;

  background: linear-gradient(
    90deg,
    #7c3aed,
    #c084fc
  );

  border-radius: 10px;
}
.lang-btn {
  padding: 8px 14px;
  margin-left: 15px;

  border: 1px solid #8b5cf6;
  border-radius: 8px;

  background: rgba(139, 92, 246, 0.12);
  color: #fff;

  font-weight: 700;
  cursor: pointer;
}

.lang-btn:hover {
  background: rgba(139, 92, 246, 0.28);
}
  
    .season-switcher { display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 18px; }
    .season-switcher[hidden] { display:none; }
    .season-choice { border:1px solid rgba(192,132,252,.35); background:#171020; color:#ded4ea; border-radius:10px; padding:9px 13px; cursor:pointer; font:inherit; font-size:13px; }
    .season-choice:hover, .season-choice.active { background:#7c3aed; border-color:#a855f7; color:white; }
  </style>
</head>

<body>

  <div class="page-bg" id="pageBg"></div>
  <div class="page-overlay"></div>

  <header>
    <a href="index.html" class="logo">
      ANIME<span>VOID</span>
    </a>

    <a id="backCatalog" href="index.html" class="back">
  ← Назад в каталог
</a>

<button id="langBtn" class="lang-btn" onclick="toggleLanguage()">
  EN
</button>
  </header>

  <main id="content"></main>

  <script>
    let currentLanguage =
  localStorage.getItem("animeVoidLanguage") || "ru";
let currentIsMovie = false;

let originalTitle = "";
let russianTitle = "";
let originalDescription = "";
let russianDescription = "";
let titleTranslationPromise = null;
let descriptionTranslationPromise = null;

const russianTitleOverrides = {
  "anilist-20954": "Форма голоса",
  "anilist-16498": "Атака титанов",
  "anilist-101922": "Клинок, рассекающий демонов",
  "anilist-113415": "Магическая битва",
  "anilist-1535": "Тетрадь смерти",
  "anilist-21459": "Моя геройская академия",
  "anilist-11061": "Охотник x Охотник",
  "anilist-21087": "Ванпанчмен",
  "anilist-21": "Ван-Пис"
};
  function translateStatus(status, lang = "ru") {
  const ru = {
    FINISHED: "Завершён",
    RELEASING: "Выходит",
    NOT_YET_RELEASED: "Ещё не вышел",
    CANCELLED: "Отменён",
    HIATUS: "Приостановлен"
  };

  const en = {
    FINISHED: "Finished",
    RELEASING: "Releasing",
    NOT_YET_RELEASED: "Not yet released",
    CANCELLED: "Cancelled",
    HIATUS: "Hiatus"
  };

  const statuses = lang === "ru" ? ru : en;

  return statuses[status] || status ||
    (lang === "ru" ? "Неизвестно" : "Unknown");
}

  function translateGenre(genre, lang = "ru") {
  if (lang === "en") {
    return genre || "Unknown";
  }

  const genres = {
    Action: "Экшен",
    Adventure: "Приключения",
    Comedy: "Комедия",
    Drama: "Драма",
    Ecchi: "Этти",
    Fantasy: "Фэнтези",
    Horror: "Ужасы",
    MahouShoujo: "Махо-сёдзё",
    Mecha: "Меха",
    Music: "Музыка",
    Mystery: "Мистика",
    Psychological: "Психология",
    Romance: "Романтика",
    SciFi: "Фантастика",
    SliceOfLife: "Повседневность",
    Sports: "Спорт",
    Supernatural: "Сверхъестественное",
    Thriller: "Триллер"
  };

  return genres[genre] || genre || "Неизвестно";
}

        async function translatePlainTextToRussian(text, cacheKey = "") {
      if (!text) return "";
      const normalize = value => String(value || "").replace(/\s+/g, " ").trim().toLocaleLowerCase();
      const source = String(text).trim();

      if (cacheKey) {
        const cached = localStorage.getItem(cacheKey);
        if (cached && normalize(cached) !== normalize(source)) return cached;
        if (cached) localStorage.removeItem(cacheKey);
      }

      function splitIntoChunks(value, maxBytes = 400) {
        const encoder = new TextEncoder();
        const words = value.match(/\S+\s*/g) || [value];
        const chunks = [];
        let current = "";
        for (const word of words) {
          if (current && encoder.encode(current + word).length > maxBytes) {
            chunks.push(current);
            current = word;
          } else {
            current += word;
          }
        }
        if (current) chunks.push(current);
        return chunks;
      }

      function decodeEntities(value) {
        const textarea = document.createElement("textarea");
        textarea.innerHTML = value;
        return textarea.value;
      }

      async function translateChunk(chunk) {
        let googleError;
        // Google fallback handles titles and descriptions that MyMemory leaves unchanged.
        try {
          const googleParams = new URLSearchParams({
            client: "gtx", sl: "en", tl: "ru", dt: "t", q: chunk
          });
          const googleResponse = await fetch(
            `https://translate.googleapis.com/translate_a/single?${googleParams.toString()}`
          );
          if (!googleResponse.ok) throw new Error(`Google Translate HTTP ${googleResponse.status}`);
          const googleData = await googleResponse.json();
          const googleResult = (googleData?.[0] || [])
            .map(segment => segment?.[0] || "")
            .join("")
            .trim();
          if (googleResult && normalize(googleResult) !== normalize(chunk)) return googleResult;
        } catch (error) {
          googleError = error;
        }

        let lastError = googleError;
        for (let attempt = 0; attempt < 2; attempt++) {
          try {
            const params = new URLSearchParams({ q: chunk, langpair: "en|ru" });
            const response = await fetch(`https://api.mymemory.translated.net/get?${params.toString()}`);
            if (!response.ok) throw new Error(`MyMemory HTTP ${response.status}`);
            const data = await response.json();
            const result = data?.responseData?.translatedText;
            if (data.responseStatus !== 200 || !result) {
              throw new Error(data.responseDetails || "MyMemory translation unavailable");
            }
            const decoded = decodeEntities(result);
            if (normalize(decoded) !== normalize(chunk)) return decoded;
            lastError = new Error("Translation service returned the source text unchanged");
          } catch (error) {
            lastError = error;
          }
          if (attempt < 1) await new Promise(resolve => setTimeout(resolve, 500));
        }
        // Translation APIs sometimes return the source unchanged or are unavailable.
        // Keep the original text without raising a console error or caching it as Russian.
        return chunk;
      }

      const parts = [];
      for (const chunk of splitIntoChunks(source)) {
        parts.push(await translateChunk(chunk));
      }
      const translated = parts.join("").trim();
      if (translated && normalize(translated) !== normalize(source)) {
        if (cacheKey) localStorage.setItem(cacheKey, translated);
        return translated;
      }
      return source;
    }
  async function translateToRussian(html, cacheKey = "") {
    if (!html) return "Описание пока отсутствует.";

    const holder = document.createElement("div");
    holder.innerHTML = html
      .replace(/<br\s*\/?\s*>/gi, "\n")
      .replace(/<\/(p|div|li)\s*>/gi, "\n\n");
    const plainText = (holder.textContent || "")
      .replace(/\n{3,}/g, "\n\n")
      .trim();
    if (!plainText) return html;

    try {
      const translated = await translatePlainTextToRussian(plainText, cacheKey);
      return translated
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\n/g, "<br>");
    } catch (error) {
      console.error("Не удалось перевести описание:", error);
      return html;
    }
  }

  function loadRussianAnimeText() {
    if (!item || currentLanguage !== "ru") return;

    const titleKey = `animeVoidRuTitle_${item.id}`;
    const descriptionKey = `animeVoidRuDescription_${item.id}`;
    const titleOverride = russianTitleOverrides[String(item.id)] || "";

    if (titleOverride) {
      russianTitle = titleOverride;
      localStorage.setItem(titleKey, titleOverride);
    } else if (!russianTitle && !titleTranslationPromise) {
      titleTranslationPromise = translatePlainTextToRussian(
        originalTitle,
        titleKey
      ).then(result => {
        russianTitle = result || "";
        if (currentLanguage === "ru") applyLanguage();
      }).catch(error => {
        console.error("Не удалось перевести название:", error);
      }).finally(() => {
        titleTranslationPromise = null;
      });
    }

    if (!russianDescription && !descriptionTranslationPromise) {
      descriptionTranslationPromise = translateToRussian(
        originalDescription,
        descriptionKey
      ).then(result => {
        russianDescription = result || "";
        if (currentLanguage === "ru") applyLanguage();
      }).catch(error => {
        console.error("Не удалось перевести описание:", error);
      }).finally(() => {
        descriptionTranslationPromise = null;
      });
    }
  }


  const params = new URLSearchParams(window.location.search);
  const animeId = params.get("id");

  const catalog = JSON.parse(
    localStorage.getItem("animeVoidCatalog") || "[]"
  );

  const item = catalog.find(
    anime => String(anime.id) === String(animeId)
  );

  const content = document.getElementById("content");

    function renderSeasonSwitcher(currentItem, allCatalog) {
      const nav = document.getElementById("seasonSwitcher");
      if (!nav) return;
      const ids = Array.isArray(currentItem.franchiseSeasonIds)
        ? currentItem.franchiseSeasonIds.map(String)
        : [String(currentItem.id)];
      const seasons = ids
        .map(id => allCatalog.find(entry => String(entry.id) === id))
        .filter(entry => entry && ["TV", "TV_SHORT"].includes(String(entry.format || "").toUpperCase()))
        .sort((a, b) => (Number(a.year) || 9999) - (Number(b.year) || 9999) ||
          String(a.id).localeCompare(String(b.id), undefined, { numeric: true }));
      if (seasons.length < 2) {
        nav.hidden = true;
        return;
      }
      nav.hidden = false;
      nav.innerHTML = seasons.map((season, index) => {
        const active = String(season.id) === String(currentItem.id);
        const label = currentLanguage === "ru" ? `Сезон ${index + 1}` : `Season ${index + 1}`;
        return `<button type="button" class="season-choice ${active ? "active" : ""}" onclick="selectAnimeSeason('${encodeURIComponent(season.id)}')">${label}</button>`;
      }).join("");
    }

    function selectAnimeSeason(encodedId) {
      const id = decodeURIComponent(encodedId);
      // Keep the season switch in the same browser tab and reuse the same detail page.
      window.location.href = `anime.html?id=${encodeURIComponent(id)}`;
    }


  if (!item) {

    content.innerHTML = `
      <div class="error">
        <h2>Аниме не найдено</h2>
        <p>Вернись в каталог и попробуй ещё раз.</p>
      </div>
    `;

  } else {

    document.getElementById("pageBg").style.backgroundImage =
      `url("${item.background || item.image}")`;

    const isMovie = String(item.format || "").toUpperCase() === "MOVIE";
    currentIsMovie = isMovie;
    const episodeCount = isMovie ? 1 : (Number(item.episodes) || 0);

    let episodesHTML = "";
    let watchedCount = 0;
let watchedPercent = 0;

    if (isMovie) {
      episodesHTML = `<button class="episode" onclick="openEpisode(1)">${currentLanguage === "ru" ? "▶ Смотреть фильм" : "▶ Watch movie"}</button>`;
    } else if (episodeCount > 0) {

      const watchedEpisodes = JSON.parse(
  localStorage.getItem(`watched_${item.id}`) || "[]"
);
 watchedCount = watchedEpisodes.length;

 watchedPercent =
  episodeCount > 0
    ? Math.round((watchedCount / episodeCount) * 100)
    : 0;

for (let i = 1; i <= episodeCount; i++) {

  const watched = watchedEpisodes.includes(i);

  episodesHTML += `
    <button
      class="episode ${watched ? "watched" : ""}"
      onclick="openEpisode(${i})"
    >
      ${watched ? "✓" : "▶"} Серия ${i}
    </button>
  `;
}
    } else {

      episodesHTML = `
        <p style="color:#8f879d">
          Информация о сериях пока отсутствует.
        </p>
      `;
    }

    content.innerHTML = `
      <section class="anime-page">

        <div class="poster">
          <img
            src="${item.image}"
            alt="${item.title}"
          >
        </div>

        <div>

          <span class="tag">
            ✦ ANIME VOID
          </span>

          <h1 id="animeTitle">${item.title}</h1>
          <nav class="season-switcher" id="seasonSwitcher" aria-label="Сезоны"></nav>

          <p
            class="description"
            id="animeDescription"
          >
            ${item.description || "Описание пока отсутствует."}
          </p>

          <div class="info-grid">

            <div class="info">
              <small id="ratingLabel">Рейтинг</small>
              <strong>
                ★ ${item.rating || "Нет данных"}
              </strong>
            </div>

            <div class="info">
              <small id="episodesLabel">${isMovie ? "Формат" : "Серии"}</small>
              <strong id="episodesValue">
                ${isMovie ? (currentLanguage === "ru" ? "Фильм" : "Movie") : (item.episodes || "Неизвестно")}
              </strong>
            </div>

            <div class="info">
              <small id="statusLabel">Статус</small>
              <strong id="statusValue">
            ${translateStatus(item.status)}
               </strong>
              </div>

            <div class="info">
              <small id="yearLabel">Год</small>
              <strong>
                ${item.year || "Неизвестно"}
              </strong>
            </div>

            <div class="info">
             <small id="genreLabel">Жанр</small>
              <strong>
                <strong id="genreValue">
  ${translateGenre(item.genre)}
</strong>
</div>
          </div>

          <button
            id="favoritePageBtn"
            class="favorite-page-btn"
            onclick="togglePageFavorite()"
          >
            ♡ В избранное
          </button>

          <div class="episodes">

           <h2 id="episodesTitle">${isMovie ? (currentLanguage === "ru" ? "Фильм" : "Movie") : (currentLanguage === "ru" ? "Серии" : "Episodes")}</h2>
            ${isMovie
              ? `<p class="episodes-progress-text">${currentLanguage === "ru" ? "Полнометражный фильм — без списка серий." : "Feature film — no episode list."}</p>`
              : `<p class="episodes-progress-text" id="episodesProgressText">Просмотрено ${watchedCount} из ${episodeCount} • ${watchedPercent}%</p>
                 <div class="episodes-progress-bar"><div class="episodes-progress-fill" style="width: ${watchedPercent}%"></div></div>`}

            <div class="episode-grid">
              ${episodesHTML}
            </div>

          </div>

        </div>

      </section>
    `;
    renderSeasonSwitcher(item, catalog);
    originalTitle = item.title || "";
    const titleCacheKey = `animeVoidRuTitle_${item.id}`;
    const savedTitle = localStorage.getItem(titleCacheKey) || "";
    const normalizeText = value => String(value || "")
      .replace(/\s+/g, " ")
      .trim()
      .toLocaleLowerCase();
    const titleOverride = russianTitleOverrides[String(item.id)] || "";
    if (savedTitle && normalizeText(savedTitle) === normalizeText(originalTitle)) {
      // Remove an untranslated value cached by an older version.
      localStorage.removeItem(titleCacheKey);
    }
    russianTitle = titleOverride || (
      savedTitle && normalizeText(savedTitle) !== normalizeText(originalTitle)
        ? savedTitle
        : ""
    );

    originalDescription = item.description || "Description unavailable";
    const descriptionCacheKey = `animeVoidRuDescription_${item.id}`;
    const savedDescription = localStorage.getItem(descriptionCacheKey) || "";
    const descriptionHolder = document.createElement("div");
    descriptionHolder.innerHTML = originalDescription
      .replace(/<br\s*\/?\s*>/gi, "\n")
      .replace(/<\/(p|div|li)\s*>/gi, "\n\n");
    const originalDescriptionPlain = (descriptionHolder.textContent || "")
      .replace(/\n{3,}/g, "\n\n")
      .trim();
    if (savedDescription && normalizeText(savedDescription) === normalizeText(originalDescriptionPlain)) {
      // Discard stale English description cache so translation is retried.
      localStorage.removeItem(descriptionCacheKey);
    }
    const usableSavedDescription = savedDescription &&
      normalizeText(savedDescription) !== normalizeText(originalDescriptionPlain)
        ? savedDescription
        : "";
    russianDescription = usableSavedDescription
      ? usableSavedDescription.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>")
      : "";

    applyLanguage();
    loadRussianAnimeText();

    updateFavoriteButton();

    if (ratingLabel) {
  ratingLabel.textContent =
    currentLanguage === "ru" ? "Рейтинг" : "Rating";
}

if (episodesLabel) {
  episodesLabel.textContent =
    currentLanguage === "ru" ? "Серии" : "Episodes";
}

if (statusLabel) {
  statusLabel.textContent =
    currentLanguage === "ru" ? "Статус" : "Status";
}

if (yearLabel) {
  yearLabel.textContent =
    currentLanguage === "ru" ? "Год" : "Year";
}

if (genreLabel) {
  genreLabel.textContent =
    currentLanguage === "ru" ? "Жанр" : "Genre";
}
  }

  function openEpisode(number) {
    if (!item) return;

    window.location.href =
      `watch.html?id=${encodeURIComponent(item.id)}&episode=${number}`;
  }

  function updateFavoriteButton() {
    const button =
      document.getElementById("favoritePageBtn");

    if (!button || !item) return;

    const favorites = JSON.parse(
      localStorage.getItem("animeVoidFavorites") || "[]"
    );

    const saved = favorites.some(
      id => String(id) === String(item.id)
    );

    button.classList.toggle("saved", saved);

    button.textContent = saved
      ? "♥ В избранном"
      : "♡ В избранное";
  }

  function togglePageFavorite() {
    if (!item) return;

    let favorites = JSON.parse(
      localStorage.getItem("animeVoidFavorites") || "[]"
    );

    const exists = favorites.some(
      id => String(id) === String(item.id)
    );

    if (exists) {
      favorites = favorites.filter(
        id => String(id) !== String(item.id)
      );
    } else {
      favorites.push(item.id);
    }

    localStorage.setItem(
      "animeVoidFavorites",
      JSON.stringify(favorites)
    );

    updateFavoriteButton();
  }


function toggleLanguage() {
  currentLanguage =
    currentLanguage === "ru" ? "en" : "ru";

  localStorage.setItem(
    "animeVoidLanguage",
    currentLanguage
  );

  applyLanguage();
  if (currentLanguage === "ru") loadRussianAnimeText();
}

function applyLanguage() {
  const isRussian = currentLanguage === "ru";
  const language = isRussian ? "ru" : "en";

  document.documentElement.lang = language;

  const setText = (id, russianText, englishText) => {
    const element = document.getElementById(id);
    if (element) {
      element.textContent = isRussian ? russianText : englishText;
    }
  };

  setText("langBtn", "EN", "RU");
  setText("backCatalog", "← Назад в каталог", "← Back to catalog");
  setText("episodesTitle", currentIsMovie ? "Фильм" : "Серии", currentIsMovie ? "Movie" : "Episodes");
  setText("ratingLabel", "Рейтинг", "Rating");
  setText("episodesLabel", currentIsMovie ? "Формат" : "Серии", currentIsMovie ? "Format" : "Episodes");
  const episodesValue = document.getElementById("episodesValue");
  if (episodesValue && currentIsMovie) episodesValue.textContent = isRussian ? "Фильм" : "Movie";
  setText("statusLabel", "Статус", "Status");
  setText("yearLabel", "Год", "Year");
  setText("genreLabel", "Жанр", "Genre");

  const animeTitle = document.getElementById("animeTitle");
  if (animeTitle) {
    animeTitle.textContent = isRussian
      ? (russianTitle || originalTitle)
      : originalTitle;
  }

  const description = document.getElementById("animeDescription");

  if (description) {
    description.innerHTML = isRussian
      ? (russianDescription || originalDescription)
      : originalDescription;
  }

  if (item) {
    const statusValue = document.getElementById("statusValue");

    if (statusValue) {
      statusValue.textContent = translateStatus(item.status, language);
    }

    const genreValue = document.getElementById("genreValue");

    if (genreValue) {
      genreValue.textContent = translateGenre(item.genre, language);
    }

    const episodesProgressText =
      document.getElementById("episodesProgressText");

    if (episodesProgressText) {
      const episodeCount = Number(item.episodes) || 0;

      const watchedEpisodes = JSON.parse(
        localStorage.getItem(`watched_${item.id}`) || "[]"
      );

      const watchedCount = watchedEpisodes.length;
      const watchedPercent = episodeCount > 0
        ? Math.round((watchedCount / episodeCount) * 100)
        : 0;

      episodesProgressText.textContent = isRussian
        ? `Просмотрено ${watchedCount} из ${episodeCount} • ${watchedPercent}%`
        : `Watched ${watchedCount} of ${episodeCount} • ${watchedPercent}%`;
    }
  }

  updateFavoriteButton();
}
  </script>
