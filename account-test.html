<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>ANIME VOID — проверка входа</title><style>body{margin:0;background:#100d19;color:#eee;font:17px system-ui;display:grid;min-height:100vh;place-items:center}main{max-width:480px;padding:30px;background:#1c1629;border:1px solid #7552a8;border-radius:22px;margin:18px}input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border-radius:10px;border:1px solid #79668f;background:#110e19;color:white;font:inherit}button{background:#7041b0;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.6}#status{overflow-wrap:anywhere}a{color:#c8a5ff}</style><main class="ym-hide-content"><h1>Проверка аккаунта</h1><p>Тестовый вход ANIME VOID. Магазин, прогресс и оформление здесь не синхронизируются.</p><form id="form"><label>Почта<input id="email" type="email" autocomplete="username" required maxlength="254"></label><label>Пароль<input id="password" type="password" autocomplete="current-password" required maxlength="128"></label><button id="login">Войти</button></form><p id="status" role="status" aria-live="polite"></p><button id="logout" hidden>Выйти</button><p>Сессия хранится только в памяти страницы. После закрытия или обновления потребуется войти снова.</p><a href="./profile.html">Вернуться в профиль</a></main><script>
'use strict';
const BASE='https://bszukonnqdujllmblwcw.supabase.co',KEY='sb_publishable_2vQbIxS-UHMuSwRJGKIBGA_TqxEiYsj';
const form=document.getElementById('form'),status=document.getElementById('status'),login=document.getElementById('login'),logout=document.getElementById('logout');let token='';
async function request(path,body,access){const control=new AbortController(),timer=setTimeout(()=>control.abort(),20000);try{const r=await fetch(BASE+'/auth/v1/'+path,{method:body===undefined?'GET':'POST',headers:{apikey:KEY,'Content-Type':'application/json',...(access?{Authorization:'Bearer '+access}:{})},...(body!==undefined?{body:JSON.stringify(body)}:{}),credentials:'omit',cache:'no-store',signal:control.signal});let d={};try{d=await r.json()}catch{}if(!r.ok){if(d.error_code==='invalid_credentials')throw Error('Неверная почта или пароль.');if(d.error_code==='email_not_confirmed')throw Error('Почта аккаунта ещё не подтверждена.');throw Error(d.msg||d.message||d.error_description||('Ошибка HTTP '+r.status))}return d}finally{clearTimeout(timer)}}
form.addEventListener('submit',async e=>{e.preventDefault();if(!form.reportValidity())return;login.disabled=true;status.textContent='Проверяем вход…';try{const d=await request('token?grant_type=password',{email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});token=d.access_token||'';document.getElementById('password').value='';if(!token)throw Error('Сервер не вернул сессию.');const u=await request('user',undefined,token);status.textContent='Вход подтверждён: '+u.email+'. Это только проверка авторизации, не облачная синхронизация профиля.';form.hidden=true;logout.hidden=false}catch(err){token='';status.textContent=err.name==='AbortError'?'Сервер не ответил вовремя. Попробуй ещё раз.':err.message}finally{login.disabled=false}});
logout.addEventListener('click',async()=>{logout.disabled=true;try{await request('logout',{},token);token='';form.hidden=false;logout.hidden=true;status.textContent='Вы вышли.'}catch(err){status.textContent='Не удалось отозвать сессию на сервере. Повтори выход. '+err.message}finally{logout.disabled=false}});
</script></html>
