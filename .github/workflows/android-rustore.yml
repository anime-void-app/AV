name: ANIME VOID Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'android-app/**'
      - '.github/workflows/android-rustore.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Android SDK 35
        shell: bash
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Optional release signing
        env:
          KEYSTORE_B64: ${{ secrets.AV_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AV_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.AV_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AV_KEY_ALIAS }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_PASSWORD" && -n "$KEY_ALIAS" ]]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/animevoid-release.jks"
            echo "AV_KEYSTORE_FILE=$RUNNER_TEMP/animevoid-release.jks" >> "$GITHUB_ENV"
            echo "AV_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "AV_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "AV_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          fi
      - name: Preserve V90 preview signing across CI runs
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: av-v90-preview-debug-keystore-1
      - name: Build Android APK
        run: gradle -p android-app :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: animevoid-android-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload store-signed APK
        if: ${{ env.AV_KEYSTORE_FILE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: animevoid-rustore-signed-apk
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
