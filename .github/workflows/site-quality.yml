name: ANIME VOID quality
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate site
        run: node --test tests/v80-offline-pwa.cjs tests/v81-video-loading.cjs tests/v81-responsive-journey.cjs tests/v82-mobile-navigation.cjs tests/v84-redesign.cjs
