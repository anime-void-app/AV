plugins { id 'com.android.application' }
android {
    namespace 'ru.animevoid.app'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.animevoid.app'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '2.2.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            def store = System.getenv('AV_KEYSTORE_FILE')
            def alias = System.getenv('AV_KEY_ALIAS')
            def keyPass = System.getenv('AV_KEY_PASSWORD')
            def storePass = System.getenv('AV_STORE_PASSWORD')
            if (store && alias && keyPass && storePass && file(store).isFile()) {
                storeFile file(store)
                storePassword storePass
                keyAlias alias
                keyPassword keyPass
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            manifestPlaceholders = [appLabel:'ANIME VOID V92']
        }
        release {
            manifestPlaceholders = [appLabel:'ANIME VOID']
            minifyEnabled false
            if (System.getenv('AV_KEYSTORE_FILE') && System.getenv('AV_KEY_ALIAS') &&
                System.getenv('AV_KEY_PASSWORD') && System.getenv('AV_STORE_PASSWORD'))
                signingConfig signingConfigs.release
        }
    }
}
