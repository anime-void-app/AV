<script>var I24=window.AVSiteI18n24;

    const LANGUAGE_KEY = "animeVoidLanguage";
    const params = new URLSearchParams(window.location.search);
    const animeId = params.get("id");
    let currentEpisode = params.has('episode') ? Number(params.get('episode')) : 1;
    const episodeSyntaxValid = Number.isSafeInteger(currentEpisode) && currentEpisode >= 1;
    function episodeAllowed(number = currentEpisode) {
      const knownCount = isMovie ? 1 : Number(item?.episodes);
      return Boolean(item) && /^(?:anilist-)?[1-9]\d*$/.test(String(animeId || '')) && Number.isSafeInteger(number) && number >= 1 && Number.isSafeInteger(knownCount) && knownCount > 0 && number <= knownCount;
    }
    function saveLastWatch() {
      if(params.has("source")||window.AVPlayer?.state().source)return;
      if (episodeAllowed()) localStorage.setItem('animeVoidLastWatch', JSON.stringify({animeId, episode:currentEpisode}));
    }
    function updateEpisodeValidation() {
      const valid = episodeAllowed();
      document.getElementById('markWatchedBtn').disabled = !valid;
      document.getElementById('prevBtn').disabled = !valid || currentEpisode <= 1;
      document.getElementById('nextBtn').disabled = !valid || currentEpisode >= episodeCount;
      let notice = document.getElementById('avEpisodeNotice');
      if (!notice) {notice=document.createElement('p');notice.id='avEpisodeNotice';notice.setAttribute('role','status');document.getElementById('episodeTitle').after(notice);}
      const ru = currentLanguage === 'ru';
      notice.replaceChildren();notice.hidden=valid;
      if (!episodeSyntaxValid) I24.text(document.getElementById('episodeTitle'),()=>((ru?I24.t("Неверный номер серии"):'Invalid episode number')));
      if (!valid) {
        I24.text(notice,()=>((!episodeSyntaxValid || (item && Number(item.episodes)>0 && currentEpisode>episodeCount) || (isMovie && currentEpisode!==1)?(ru?I24.t("Неверный номер серии. Отметки не изменены. "):'Invalid episode number. Progress unchanged. '):(ru?I24.t("Для отметки просмотра дождитесь загрузки числа серий. "):'Wait for episode information before marking progress. '))));
        if (item && episodeSyntaxValid === false || item && !valid && Number(item.episodes)>0) {const link=document.createElement('a');link.href='watch.html?id='+encodeURIComponent(animeId)+'&episode=1';I24.text(link,()=>((ru?I24.t("Открыть первую серию"):'Open episode one')));notice.append(link);}
      }

    }
    const catalog = AVSafe.read("animeVoidCatalog", []);
    let item = catalog.find(anime => String(anime.id) === String(animeId));
    // Existing catalogue identity/count only; no catalogue additions or availability inference.
    const officialSource = [...(window.AVVideoSources?.sources||[]),...(window.AVVideoSources?.providers||[])].find(s=>s.animeId==='anilist-'+String(animeId||'').replace(/^anilist-/,''));
    if(!item && officialSource)item={id:officialSource.animeId,title:officialSource.titleRu,titleRomaji:officialSource.titleEn,titleEnglish:officialSource.titleEn,episodes:officialSource.canonicalEpisodes,format:'TV'};
    let isMovie = String(item?.format || "").toUpperCase() === "MOVIE";
    let episodeCount = isMovie ? 1 : Math.max(1, Number(item?.episodes) || 1);
    let currentLanguage = localStorage.getItem(LANGUAGE_KEY) === "en" ? "en" : "ru";

    // Record history only after both the title and episode have been validated.

    let metadataState='loading';
    async function loadAnimeMetadata(){
      const m=/^(?:anilist-)?([1-9]\d*)$/.exec(animeId||'');if(!m)return;
      const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
      try{const response=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json'},signal:controller.signal,body:JSON.stringify({query:'query($id:Int){Media(id:$id,type:ANIME){id title{romaji english} episodes duration format}}',variables:{id:Number(m[1])}})});if(!response.ok)throw Error('Metadata unavailable');const media=(await response.json())?.data?.Media;if(!media||media.id!==Number(m[1]))throw Error('Metadata identity mismatch');item={...item,id:animeId,title:item?.title||media.title?.english||media.title?.romaji||'ANIME VOID',episodes:media.episodes??item?.episodes,duration:media.duration??item?.duration,format:media.format||item?.format};isMovie=String(item.format||'').toUpperCase()==='MOVIE';episodeCount=isMovie?1:Math.max(1,Number(item.episodes)||1);document.getElementById('backAnime').href='anime.html?id='+encodeURIComponent(animeId);document.querySelector('.controls').style.display=isMovie?'none':'';document.querySelector('.episodes').style.display=isMovie?'none':'';
      metadataState='ready';}catch{metadataState='error';}finally{clearTimeout(timer);applyLanguage();}
    }

    if (item) {
      document.getElementById("animeTitle").textContent = AVTitles.display(item,currentLanguage) || "ANIME VOID";
      if (isMovie) {
        document.querySelector(".controls").style.display = "none";
        document.querySelector(".episodes").style.display = "none";
      }
      document.getElementById("backAnime").href =
        `anime.html?id=${encodeURIComponent(item.id)}`;
    } else {
      I24.text(document.getElementById("animeTitle"),()=>((currentLanguage === "ru"?I24.t("Загрузка аниме…"):"Loading anime…")));
      document.getElementById("backAnime").href = "index.html";
      document.getElementById("episodeGrid").innerHTML = "";
    }

    document.getElementById("prevBtn").addEventListener("click", () => {
      if (episodeAllowed() && currentEpisode > 1) openEpisode(currentEpisode - 1);
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      if (episodeAllowed() && currentEpisode < episodeCount) openEpisode(currentEpisode + 1);
    });

    function logActivity(kind) {
      try {
        const today = new Date().toISOString().slice(0, 10);
        const log = AVSafe.read("animeVoidActivityLog", {});
        log[today] = log[today] || { eps: 0, favs: 0, ratings: 0 };
        log[today][kind] = (log[today][kind] || 0) + 1;
        localStorage.setItem("animeVoidActivityLog", JSON.stringify(log));
      } catch (error) {}
    }

    const watchIdentity='anilist-'+String(animeId||'').replace(/^anilist-/,'');
    async function commitWatch(number,mode,duration){
      if(!episodeAllowed(number))return false;
      if(mode==='auto'&&!navigator.locks?.request)throw Error('Безопасная блокировка хранилища недоступна / Safe storage lock unavailable');
      const change=()=>{
        const keys=['watched_'+watchIdentity,'watched_'+watchIdentity.slice(8)],existing=keys.filter(k=>localStorage.getItem(k)!==null);
        const all=new Set();for(const k of existing){const raw=localStorage.getItem(k);const clean=AVSafe.validateBackup({app:'ANIME VOID',version:1,data:{[k]:raw}});for(const n of JSON.parse(clean[k]))all.add(n);}
        const present=all.has(number); // Existing marks stay; a verified runtime can still be refreshed.
        if(mode==='auto'||!present)all.add(number);else all.delete(number);
        const list=[...all].sort((a,b)=>a-b),writes={};for(const k of existing.length?existing:[keys[0]])writes[k]=JSON.stringify(list);
        if(Number.isFinite(duration)&&duration>0&&duration<=43200){for(const k of existing.length?existing:[keys[0]])writes['duration_'+k.slice(8)+'_'+number]=JSON.stringify(duration);}
        const snapshotsRaw=localStorage.getItem('animeVoidListItems'),snapshots=snapshotsRaw===null?{}:JSON.parse(AVSafe.validateBackup({app:'ANIME VOID',version:1,data:{animeVoidListItems:snapshotsRaw}}).animeVoidListItems);
        snapshots[watchIdentity]={...item,id:watchIdentity,episodes:episodeCount};writes.animeVoidListItems=JSON.stringify(snapshots);
        if(list.filter(n=>n>=1&&n<=episodeCount).length===episodeCount){const raw=localStorage.getItem('animeVoidStatuses'),map=raw===null?{}:JSON.parse(AVSafe.validateBackup({app:'ANIME VOID',version:1,data:{animeVoidStatuses:raw}}).animeVoidStatuses);map[watchIdentity]='completed';writes.animeVoidStatuses=JSON.stringify(map);}
        const clean=AVSafe.validateBackup({app:'ANIME VOID',version:1,data:writes}),original=Object.fromEntries(Object.keys(clean).map(k=>[k,localStorage.getItem(k)])),changed=[];
        try{for(const[k,v]of Object.entries(clean)){localStorage.setItem(k,v);changed.push(k);}}catch(error){for(const k of changed.reverse())try{if(original[k]===null)localStorage.removeItem(k);else localStorage.setItem(k,original[k]);}catch{}throw error;}
        if(!present)logActivity('eps');return true;
      };
      const result=navigator.locks?.request?await navigator.locks.request('av-watch:'+watchIdentity,change):change();
      renderEpisodes();updateMarkWatchedButton();dispatchEvent(new Event('av:progress'));if(window.AVRewards)try{await AVRewards.sync();}catch{}return result;
    }
    window.AVWatchAutoComplete=(number,duration)=>commitWatch(number,'auto',duration);
    window.AVWatchMarks=()=>getWatchedEpisodes();
    document.getElementById('markWatchedBtn').addEventListener('click',async()=>{const button=document.getElementById('markWatchedBtn');if(!episodeAllowed()||button.disabled)return;button.disabled=true;try{await commitWatch(currentEpisode,'toggle');}catch(e){const note=document.getElementById('avEpisodeNotice');note.hidden=false;note.textContent=(currentLanguage==='ru'?'Отметка не сохранена: ':'Mark not saved: ')+String(e.message).slice(0,150);}finally{button.disabled=!episodeAllowed();}});
    addEventListener('av:progress',()=>{renderEpisodes();updateMarkWatchedButton();});
    addEventListener('storage',e=>{if(e.key?.startsWith('watched_')){renderEpisodes();updateMarkWatchedButton();}});

    document.getElementById("prevBtn").disabled = currentEpisode <= 1;
    document.getElementById("nextBtn").disabled = currentEpisode >= episodeCount;

    function getWatchedEpisodes() {
      const id='anilist-'+String(animeId||'').replace(/^anilist-/,''),result=new Set();
      for(const key of ['watched_'+id,'watched_'+id.slice(8)]){const raw=localStorage.getItem(key);if(raw===null)continue;try{const a=JSON.parse(AVSafe.validateBackup({app:'ANIME VOID',version:1,data:{[key]:raw}})[key]);for(const n of a)if(n<=episodeCount)result.add(n);}catch{}}
      return [...result].sort((a,b)=>a-b);
    }

    function updateMarkWatchedButton() {
      const button = document.getElementById("markWatchedBtn");
      if (!button) return;
      const isRussian = currentLanguage === "ru";
      const isWatched = getWatchedEpisodes().includes(currentEpisode);
      I24.text(button,()=>((isWatched?(isRussian?I24.t("✕ Снять отметку"):"✕ Unmark as watched"):(isRussian?I24.t("✓ Отметить просмотренной"):"✓ Mark as watched"))));
    }

    function renderEpisodes() {
      if (!item || isMovie) return;
      const watchedEpisodes = getWatchedEpisodes();
      const grid = document.getElementById("episodeGrid");
      grid.innerHTML = "";

      for (let number = 1; number <= episodeCount; number++) {
        const watched = watchedEpisodes.includes(number);
        const button = document.createElement("button");
        button.type = "button";
        button.className = `episode${number === currentEpisode ? " active" : ""}${watched ? " watched" : ""}`;
        button.textContent = `${watched ? "✓" : "○"} ${episodeLabel(number)}`;
        button.addEventListener("click", () => openEpisode(number));
        grid.appendChild(button);
      }
      updateMarkWatchedButton();
    }

    function episodeLabel(number) {
      if (isMovie) return currentLanguage === "ru" ? "Фильм" : "Movie";
      return currentLanguage === "ru" ? `Серия ${number}` : `Episode ${number}`;
    }

    function applyLanguage() {
      const isRussian = currentLanguage === "ru";
      document.documentElement.lang = currentLanguage;

      if(item) document.getElementById("animeTitle").textContent=AVTitles.display(item,currentLanguage);
      document.getElementById("langBtn").textContent = isRussian ? "EN" : "RU";
      I24.text(document.getElementById("profileLink"),()=>((isRussian?I24.t("👤 Профиль"):"👤 Profile")));
      I24.text(document.getElementById("backAnime"),()=>((isRussian?I24.t("← К странице аниме"):"← Back to anime")));
      document.getElementById("episodeTitle").textContent = episodeLabel(currentEpisode);
      I24.text(document.getElementById("prevBtn"),()=>((isMovie?(isRussian?I24.t("Фильм"):"Movie"):(isRussian?I24.t("← Предыдущая серия"):"← Previous episode"))));
      I24.text(document.getElementById("nextBtn"),()=>((isMovie?(isRussian?I24.t("Фильм"):"Movie"):(isRussian?I24.t("Следующая серия →"):"Next episode →"))));
      updateMarkWatchedButton();
      I24.text(document.getElementById("episodesHeading"),()=>((isMovie?(isRussian?I24.t("Фильм"):"Movie"):(isRussian?I24.t("Все серии"):"All episodes"))));
      if (!item) {
        I24.text(document.getElementById("animeTitle"),()=>((metadataState === "error"?(isRussian?I24.t("Не удалось загрузить аниме"):"Could not load anime"):(isRussian?I24.t("Загрузка аниме…"):"Loading anime…"))));
      }
      renderEpisodes();
      updateEpisodeValidation();
      saveLastWatch();
      window.AVPlayer?.refreshLanguage();
    }

    window.AVWatchEpisodeChanged = number => {if(Number.isSafeInteger(number)&&number>=1){currentEpisode=number;applyLanguage();}};

    function applyThemeFromStorage() {
      let theme = "dark";
      try { theme = localStorage.getItem("animeVoidTheme") || "dark"; } catch (error) {}
      document.body.classList.toggle("theme-light", theme === "light");
      const themeToggle = document.getElementById("themeToggle");
      if (themeToggle) themeToggle.textContent = theme === "light" ? "☀️" : "🌙";
    }

    function toggleTheme() {
      const isLight = document.body.classList.toggle("theme-light");
      try { localStorage.setItem("animeVoidTheme", isLight ? "light" : "dark"); } catch (error) {}
      const themeToggle = document.getElementById("themeToggle");
      if (themeToggle) themeToggle.textContent = isLight ? "☀️" : "🌙";
    }

    applyThemeFromStorage();

    function toggleLanguage() {
      currentLanguage = currentLanguage === "ru" ? "en" : "ru";
      localStorage.setItem(LANGUAGE_KEY, currentLanguage);
      applyLanguage();
    }

    function openEpisode(number) {
      if(window.AVPlayer?.selectEpisode){window.AVPlayer.selectEpisode(number);return;}
      window.location.href =
        `watch.html?id=${encodeURIComponent(animeId)}&episode=${number}`;
    }

    renderEpisodes();
    applyLanguage();
    updateEpisodeValidation();
    loadAnimeMetadata();
  </script>

      });
